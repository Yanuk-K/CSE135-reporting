<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <title>Analytics Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="site-shell">
  <noscript>
    <header class="dashboard-header">
      <a href="/" class="brand">Analytics Dashboard</a>
    </header>
    <main class="dashboard-content">
      <section class="panel">
        <h1>JavaScript Required</h1>
        <p>This dashboard requires JavaScript to load reports, charts, and authentication flows.</p>
        <div class="error-box">
          Enable JavaScript in your browser, then reload this page to continue.
        </div>
        <p><a href="/">Return to home</a></p>
      </section>
    </main>
    <footer class="dashboard-footer">
      <small>CSE 135 Dashboard</small>
    </footer>
  </noscript>
  <div class="dashboard-shell">
    <header class="dashboard-header">
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Toggle menu">Menu</button>
      <a href="#/overview" class="brand">Analytics Dashboard</a>
      <div id="date-controls" class="date-controls">
        <label for="start-date">Start</label>
        <input id="start-date" type="date" />
        <label for="end-date">End</label>
        <input id="end-date" type="date" />
        <button id="apply-dates" type="button">Apply</button>
        <button id="view-mode-btn" type="button" class="hidden">View Saved Report</button>
        <button id="save-report-btn" type="button">Save Report</button>
        <button id="export-btn" type="button">Export PDF</button>
      </div>
      <div class="user-controls">
        <span id="user-label" class="user-label">Guest</span>
        <button id="logout-btn" type="button">Logout</button>
      </div>
    </header>

    <aside id="sidebar" class="dashboard-sidebar">
      <nav id="main-nav">
        <a href="#/overview" data-route="/overview">Overview</a>
        <a href="#/sessions" data-route="/sessions">Sessions</a>
        <a href="#/performance" data-route="/performance">Performance</a>
        <a href="#/errors" data-route="/errors">Errors</a>
        <a href="#/admin" data-route="/admin">Admin</a>
        <a href="#/login" data-route="/login">Login</a>
      </nav>
    </aside>

    <main id="content" class="dashboard-content"></main>

    <footer class="dashboard-footer">
      <small>CSE 135 Dashboard</small>
    </footer>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/overview.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.zingchart.com/zingchart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/savedView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
